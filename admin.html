<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin</title><link rel="stylesheet" href="./styles.css"/></head>
<body>
<header class="top"><h1>Admin</h1><nav><a href="/index.html">Store</a> <a href="/login.html">Login</a></nav></header>
<main class="grid">
  <section class="card"><h2>KPI</h2><pre id="kpi" class="small"></pre></section>
  <section class="card"><h2>Orders</h2><pre id="orders" class="small"></pre></section>
  <section class="card"><h2>Products</h2><pre id="products" class="small"></pre></section>
</main>
<script type="module">
document.getElementById("kpi").textContent = JSON.stringify(await fetch("/api/analytics/kpi").then(r=>r.json()), null, 2);
document.getElementById("orders").textContent = JSON.stringify(await fetch("/api/admin/orders").then(r=>r.json()), null, 2);
document.getElementById("products").textContent = JSON.stringify(await fetch("/api/admin/products").then(r=>r.json()), null, 2);
</script>
</body></html>

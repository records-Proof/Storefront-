<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Enterprise Storefront v2</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <header class="top">
    <h1>Enterprise Storefront v2</h1>
    <nav>
      <a href="/index.html">Store</a>
      <a href="/account.html">Account</a>
      <a href="/admin.html">Admin</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Products</h2>
      <div id="products"></div>
    </section>

    <section class="card">
      <h2>Cart</h2>
      <div id="cart"></div>
      <button id="checkout">Checkout (Stripe)</button>
      <p class="small">After payment, Stripe redirects to <code>/success.html</code> where gated links appear.</p>
    </section>
  </main>

<script type="module">
const productsEl = document.getElementById("products");
const cartEl = document.getElementById("cart");
const cart = new Map();

function renderCart(){
  cartEl.innerHTML = "";
  if (cart.size === 0){ cartEl.textContent = "Cart empty"; return; }
  for (const [id, qty] of cart.entries()){
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span>${id}</span><span>x${qty}</span>`;
    cartEl.appendChild(row);
  }
}

const data = await fetch("/api/products").then(r=>r.json());
(data.items||[]).forEach(p => {
  const row = document.createElement("div");
  row.className="row";
  row.innerHTML = `<span><strong>${p.title}</strong><br><span class="small">${(p.price_cents/100).toFixed(2)} USD</span></span>
                   <button>Add</button>`;
  row.querySelector("button").onclick = () => {
    cart.set(p.id, (cart.get(p.id)||0)+1);
    renderCart();
  };
  productsEl.appendChild(row);
});

renderCart();

document.getElementById("checkout").onclick = async () => {
  if (cart.size === 0) return alert("Cart empty");
  const items = [...cart.entries()].map(([id,qty]) => ({ id, qty }));
  const resp = await fetch("/api/checkout/create-session", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ items })
  });
  const out = await resp.json();
  if (!out.url) return alert(out.error || "Checkout failed");
  window.location.href = out.url;
};
</script>
</body>
</html>
